# Progression for Horizon 2.6: the server's settings.
# This file is created in config/progression/ on the first start; edit it there and restart
# (or run /progressadmin reload).
#
# How it works: players earn progression experience only from advancements, each one once (vanilla,
# the datapacks' and the mods', e.g. finding a new structure). Nothing repeatable gives any, so
# there is nothing to farm. Experience raises the progression level, which is
# kept on the server and never lost on death. Each level gives perk points (ОП). Perks cost
# points and open at a level of their own. No perk gives a beacon or potion effect.

[settings]
# The layout of this file. An older file is kept aside as progression-v<N>.toml and replaced.
version = 8
max_level = 50
# Experience from level n to n + 1: xp_base + xp_step * n.
xp_base = 200
xp_step = 40
# Points for each level, and a bonus every few levels.
points_per_level = 6
bonus_every = 5
bonus_points = 5
# Vanilla levels a respec costs for every perk point it gives back.
respec_levels_per_point = 1
# Melee damage one player deals to another is multiplied by this (1.0 = vanilla).
pvp_damage_multiplier = 1.5
# The swap-hands key (F) dashes forward for players who bought a dash, Shift+F dashes up.
swap_hands_dash = true
# Dashes on the Horizon client: a push in blocks a tick (forward: about 7 blocks at 1.0).
dash_forward_speed = 1.0
dash_forward_lift = 0.25
dash_up_speed = 1.3
# Spirit: how far from the body (blocks), and how long after damage it can't start (seconds).
spirit_radius = 32.0
spirit_after_damage_seconds = 10
# Advancements: weight (advancements.toml: task 1, goal 3, challenge 5) x this = experience.
default_advancement_points = 1
advancement_xp_per_point = 120
# The enchanting altar: altar_block standing on altar_base. A right click opens the altar menu.
altar_block = "minecraft:enchanting_table"
altar_base = "minecraft:amethyst_block"
# The anvil never asks for more levels than this (vanilla refuses at 40).
anvil_max_cost = 39
# Whether a chunk anchor keeps working while its owner is offline.
anchor_offline = false
# The resource pack with the menus. The mod serves it itself on pack_port (0 = don't) and tells
# clients to load http://<pack_host>:<pack_port>/progression.zip : put the server's public
# address in pack_host and open the port. Or host the zip elsewhere and set pack_url.
pack_port = 25580
pack_host = "127.0.0.1"
pack_url = ""
pack_required = false

# Advancements whose weight isn't the usual one for their frame. They win over advancements.toml.
[advancement_points]
"minecraft:end/kill_dragon" = 25
"progression:boss/kill_wither" = 20
"progression:toolkit/dry_lava" = 3

# Perks. branch: survival, pvp, pve, build, redstone, cart, horse or elytra (a column of the
# map, a row of the menu, up to 8 perks). costs[i] points buy tier i + 1 once the player's progression level is
# levels[i]. A perk sets attribute modifiers (per_level x tier, with the vanilla operation), and
# the ids the mod knows do more: wisdom, hunter, trophies, scholar (amount = percent a tier),
# dash_forward, dash_up, spirit, anchor, lab (keys), void_walker, last_stand (cooldown_seconds,
# halved by each tier past the first), alchemist, clear_mind, timber (amount = logs a tier),
# pickaxe3, shovel3, altar_tools, altar_armor, altar_weapons, hard_head, trowel, mason, draft
# (amount = blocks one fill places at II, eight times as many at III), relay (amount = targets a
# transmitter holds at I, four times more a tier; any distance in the same world), cart_speed,
# cart_drive, cart_return, horse_speed (amount = percent a tier), horse_descent, horse_terrain,
# horse_call, horse_leaves, horse_bags, elytra_wear and elytra_rockets (amount = percent chance
# a tier), elytra_wall, elytra_glide. parent: the perk the map draws it after.

