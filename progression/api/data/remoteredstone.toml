# Дистанційний редстоун (RemoteRedstone для Horizon).
# Файл читається один раз після старту сервера: після змін перезапусти сервер.

# Блок, яким стає передавач. Ставиться зі спеціального предмета (рецепт нижче або /rr give),
# звичайний такий самий блок передавачем не є. Лампа світиться, коли передавач отримує сигнал.
block = "minecraft:redstone_lamp"

# Скільки блоків-цілей може мати один передавач (1..1024).
max_targets = 64

# Найбільша відстань від передавача до цілі по кожній осі, у блоках. 0 = без обмеження.
# Цілі мають бути в тому самому світі (Overworld / Nether / End), що й передавач.
max_distance = 0

# Рецепт крафту: перлина Енду зверху, редстоун з боків і знизу, лампа в центрі.
# false = отримати можна лише через /rr give (оператори), наприклад якщо мод прогресії
# видаватиме передавач сам.
recipe = true

# true = змінювати цілі й ламати передавач може лише той, хто його поставив (і оператори 2+).
owner_only = true

# Режим «вибрати кліком» вимикається сам через стільки секунд без кліків.
link_seconds = 120
